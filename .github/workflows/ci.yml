name: Host RTOS
on: [push, pull_request, workflow_dispatch]
jobs:
  # Windows is the locally validated full RTOS target. The optional POSIX CMake
  # path remains available, but is not a claimed CI baseline until exercised.
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
